name: Phoenix web UI verification

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  web-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web assets
        run: npm --workspace=@qooqnos/web run build
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run UI E2E smoke
        run: node scripts/e2e-web-ui.mjs
