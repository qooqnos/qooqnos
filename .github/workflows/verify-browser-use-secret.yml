name: Verify Browser Use Secret

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04

    env:
      BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}

    steps:
      - name: Verify Browser Use secret
        shell: bash
        run: |
          if [ -z "$BROWSER_USE_API_KEY" ]; then
            echo "BROWSER_USE_API_KEY is NOT configured"
            exit 1
          fi

          case "$BROWSER_USE_API_KEY" in
            bu_*)
              echo "BROWSER_USE_API_KEY is configured and has the expected prefix"
              ;;
            *)
              echo "BROWSER_USE_API_KEY is configured but has an unexpected format"
              exit 1
              ;;
          esac
