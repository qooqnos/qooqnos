name: Phoenix verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify migration catalog and lock
        run: npm run verify:migrations

      - name: Verify canonical source boundary
        run: npm run verify:source-boundary

      - name: Verify runtime module registry
        run: npm run verify:runtime-registry

      - name: Build workspace
        run: npm run build

      - name: Run tests
        run: npm test
