name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Rule 8 needs the merge-base commit in order to compare migration
          # and lock-manifest changes on both pull requests and pushes.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The repository currently carries a pre-existing formatting baseline
      # across documentation and older source files. Keep format visibility
      # without preventing the correctness gates from running.
      - name: Format check
        continue-on-error: true
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Verify full migration catalog and lock
        run: npm run verify:migrations

      - name: Report database completion
        run: npm run report:database

      - name: Verify canonical source boundary
        run: npm run verify:source-boundary

      - name: Verify runtime module registry
        run: npm run verify:runtime-registry

      - name: Verify migration history changes
        run: npm run migration:check:changes
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Cloudflare Worker dry run
        run: npm run verify:worker

      - name: Unit tests
        run: npm test
