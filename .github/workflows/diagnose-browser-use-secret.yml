name: Diagnose Browser Use Secret Injection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose Browser Use secret context
    runs-on: ubuntu-24.04

    steps:
      - name: Check repository and workflow context
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "Repository: $REPOSITORY"
          echo "Ref: $REF"
          echo "Event: $EVENT"
          echo "Actor: $ACTOR"

      - name: Check secret injection without exposing the value
        env:
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${BROWSER_USE_API_KEY:-}" ]; then
            echo "RESULT: BROWSER_USE_API_KEY is EMPTY in this job."
            echo "The workflow can reference the secret, but GitHub supplied no value."
            exit 10
          fi

          length="${#BROWSER_USE_API_KEY}"
          prefix="${BROWSER_USE_API_KEY:0:3}"

          echo "RESULT: BROWSER_USE_API_KEY is injected."
          echo "Length: $length"
          echo "Prefix: $prefix"

          if [[ "$BROWSER_USE_API_KEY" == bu_* ]]; then
            echo "FORMAT: expected bu_ prefix detected."
          else
            echo "FORMAT: value is present but does not start with bu_."
            exit 11
          fi

      - name: Check secret through job environment mapping
        env:
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -v BROWSER_USE_API_KEY ] && [ -n "${BROWSER_USE_API_KEY:-}" ]; then
            echo "ENV_MAPPING: present and non-empty."
          else
            echo "ENV_MAPPING: missing or empty."
            exit 12
          fi

      - name: Diagnostic summary
        if: ${{ success() }}
        run: |
          echo "DIAGNOSTIC RESULT: Browser Use secret injection is working."
