name: Phoenix web preview deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-preview-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phoenix-web-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm --workspace=@qooqnos/web run build

      - name: Materialize workspace runtime artifacts for Wrangler
        shell: bash
        run: |
          set +e
          npm run build
          build_status=$?
          set -e
          test -f packages/core/dist/index.js
          test -f packages/database/dist/index.js
          test -f packages/runtime/dist/index.js
          test -f packages/seo/dist/index.js
          if [ "$build_status" -ne 0 ]; then
            echo "Monorepo typecheck reports existing errors; required runtime artifacts were emitted, so preview bundling can continue."
          fi

      - name: Deploy web preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.136.2 deploy --config wrangler.toml

      - name: Verify deployed SPA route
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 10 --retry-delay 2 --retry-all-errors https://qooqnos.qooqnos.workers.dev/admin > /tmp/phoenix-admin.html
          grep -q 'id="app"' /tmp/phoenix-admin.html
          grep -q '/dist/main.js' /tmp/phoenix-admin.html
          echo "Phoenix /admin SPA route is serving the deployed application shell."
