name: Phoenix web preview deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-preview-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phoenix-web-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets and Worker
        run: npm --workspace=@qooqnos/web run build

      - name: Deploy web preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.136.2 deploy --config wrangler.toml
