name = "qooqnos"
main = "apps/api/src/index.ts"
compatibility_date = "2026-09-15"
workers_dev = true

[assets]
directory = "./apps/web/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/*"]

[ai]
binding = "AI"

# D1 is the canonical runtime database. The remote database_id is environment-specific
# and must be inserted only after the Cloudflare D1 database is actually provisioned.
# Keep this commented until the real database IDs exist; do not invent UUIDs here.
#
# Example production binding:
# [[env.production.d1_databases]]
# binding = "DB"
# database_name = "qooqnos-production"
# database_id = "<REAL_D1_DATABASE_ID>"
#
# Example staging binding:
# [[env.staging.d1_databases]]
# binding = "DB"
# database_name = "qooqnos-staging"
# database_id = "<REAL_D1_DATABASE_ID>"

[alias]
"@qooqnos/ai" = "./packages/ai/src/index.ts"
"@qooqnos/auth" = "./packages/auth/src/index.ts"
"@qooqnos/billing" = "./packages/billing/src/index.ts"
"@qooqnos/communication" = "./packages/communication/src/index.ts"
"@qooqnos/automation" = "./packages/automation/src/index.ts"
"@qooqnos/integration" = "./packages/integration/src/index.ts"
"@qooqnos/privacy" = "./packages/privacy/src/index.ts"
"@qooqnos/matching" = "./packages/matching/src/index.ts"
"@qooqnos/customer" = "./packages/customer/src/index.ts"
"@qooqnos/fulfillment" = "./packages/fulfillment/src/index.ts"
"@qooqnos/case-support" = "./packages/case-support/src/index.ts"
"@qooqnos/trust" = "./packages/trust/src/index.ts"
"@qooqnos/business" = "./packages/business/src/index.ts"
"@qooqnos/booking" = "./packages/booking/src/index.ts"
"@qooqnos/commerce" = "./packages/commerce/src/index.ts"
"@qooqnos/catalog" = "./packages/catalog/src/index.ts"
"@qooqnos/media" = "./packages/media/src/index.ts"
"@qooqnos/core" = "./packages/core/src/index.ts"
"@qooqnos/database" = "./packages/database/src/index.ts"
"@qooqnos/discovery" = "./packages/discovery/src/index.ts"
"@qooqnos/onboarding" = "./packages/onboarding/src/index.ts"
"@qooqnos/runtime" = "./packages/runtime/src/index.ts"
"@qooqnos/api-contracts" = "./packages/api-contracts/src/index.ts"
"@qooqnos/documents" = "./packages/documents/src/index.ts"

[vars]
APP_VERSION = "0.1.0"

[env.staging]
name = "qooqnos-staging"
vars = { APP_VERSION = "staging", ENVIRONMENT = "staging" }

[env.production]
name = "qooqnos-production"
vars = { APP_VERSION = "production", ENVIRONMENT = "production", SEO_CANONICAL_BASE_URL = "https://qooqnos.com", SEO_CRAWLER_SAMPLE_LIMIT = "25", SEO_MEASUREMENT_SAMPLE_LIMIT = "25", SEO_COMPETITIVE_SAMPLE_LIMIT = "10", SEO_COMPETITIVE_DEPTH = "20", SEO_COMPETITIVE_PAGE_SAMPLE_LIMIT = "5", SEO_COMPETITIVE_KEYWORD_GAP_COMPETITOR_LIMIT = "3", SEO_COMPETITIVE_KEYWORD_GAP_LIMIT = "15", SEO_COMPETITIVE_LINK_GAP_COMPETITOR_LIMIT = "2", SEO_COMPETITIVE_LINK_GAP_LIMIT = "15", SEO_GSC_SITE_URL = "https://qooqnos.com/", SEO_GSC_LOOKBACK_DAYS = "7", SEO_GSC_END_LAG_DAYS = "3", SEO_BING_SITE_URL = "https://qooqnos.com/" }

[env.production.triggers]
crons = [ "17 * * * *", "41 2 * * *", "17 3 * * *" ]

# Queue and R2 resources are also environment-specific. Keep these examples commented
# until the real Cloudflare resources exist.
#
# [[env.production.queues.producers]]
# binding = "OUTBOX_QUEUE"
# queue = "qooqnos-outbox-production"
#
# [[env.production.queues.consumers]]
# queue = "qooqnos-outbox-production"
# max_batch_size = 50
# max_batch_timeout = 30
#
# [[env.production.r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "qooqnos-media-production"

