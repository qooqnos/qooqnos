name = "qooqnos"
main = "apps/api/src/index.ts"
compatibility_date = "2026-09-15"
workers_dev = true

[assets]
directory = "./apps/web/public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health", "/ready"]

[ai]
binding = "AI"

[vars]
APP_VERSION = "0.1.0"

[env.staging]
name = "qooqnos-staging"
vars = { APP_VERSION = "staging" }

[env.production]
name = "qooqnos-production"
vars = { APP_VERSION = "production" }
